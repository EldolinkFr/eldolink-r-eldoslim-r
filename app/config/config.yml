# MopaBootstrapBundle Configuration
mopa_bootstrap:
    form:
        checkbox_label: 'label'
        show_legend: false
        render_fieldset: false
        render_optional_text: false

# KnpSnappyBundle Configuration
knp_snappy:
    pdf:
        enabled:    true
        binary:     /usr/local/bin/wkhtmltopdf
        options:    []
    image:
        enabled:    true
        binary:     /usr/local/bin/wkhtmltoimage
        options:    []

# FOSUserBundle Configuration
fos_user:
    db_driver: orm
    firewall_name: main
    user_class: eldo\MainBundle\Entity\Customer
    service:
        user_manager: eldo_main.customer_manager
    from_email:
        address:        %app.admin_email%
        sender_name:    %app.admin_email%

# FOSRestBundle Configuration
fos_rest:
    param_fetcher_listener: true
    body_listener: true
    format_listener:
        rules:
            - { path: '^/api', priorities: [ json, xml ], fallback_format: ~, prefer_extension: true }
            - { path: '^/', stop: true }
            
    body_converter:
        enabled: false
        validate: false
    
    view:
        view_response_listener: 'force'
        formats:
            xml:  true
            json: true
        templating_formats:
            html: true

    exception:
        codes:
            'Symfony\Component\Routing\Exception\ResourceNotFoundException': 404
            'Doctrine\ORM\OptimisticLockException': HTTP_CONFLICT
        messages:
            'Symfony\Component\Routing\Exception\ResourceNotFoundException': true
    allowed_methods_listener: true
    access_denied_listener:
        json: true

    disable_csrf_role: ROLE_API

# NelmioApiDocBundle Configuration
nelmio_api_doc: ~

# JMSTranslationBundle Configuration
jms_translation:
    configs:
        app:
            dirs: [%kernel.root_dir%, %kernel.root_dir%/../src]
            output_dir: %kernel.root_dir%/Resources/translations
            ignored_domains: [routes]
            excluded_names: ["*TestCase.php", "*Test.php"]
            excluded_dirs: [cache, data, logs]

# JMSI18nRoutingBundle Configuration
jms_i18n_routing:
    default_locale: "%locale%"
    locales: "%app.locales%"
    strategy: prefix_except_default
    
# DoctrineCacheBundle Configuration
doctrine_cache:
    providers:
        memcached_cache:
            namespace: memcached_ns
            type: memcached

# MobileDetectBundle Configuration
mobile_detect:
    redirect:
        mobile: ~
        tablet: ~
    switch_device_view: ~

# Stof\DoctrineExtensionBundle configuration
stof_doctrine_extensions:
    orm:
        default:
            sluggable: true
            loggable: true

# KnpGaufretteBundle configuration
knp_gaufrette:
    stream_wrapper: ~

    adapters:
        media_local_adapter:
            local:
                directory: %kernel.root_dir%/../web/uploads/files
        media_database_adapter:
            doctrine_dbal:
                connection_name: default
                table: eldo_media
                columns:
                    key: file_name
                    content: file_data
                    mtime: uploadedat
                    checksum: file_checksum

    filesystems:
        media_fs:
            adapter:    media_local_adapter
        database_fs:
            adapter:    media_database_adapter

# VichUploaderBundle configuration
vich_uploader:
    db_driver: orm
    storage:   gaufrette

    mappings:
        file:
            uri_prefix:         /uploads/files
            upload_destination: media_fs
#             upload_destination: database_fs
            namer:              vich_uploader.namer_uniqid

# GoogleBundle Configuration
google:
    analytics:
        enhanced_ecommerce: false
        trackers:
            default:
                name: 'default'
                accountId: %app.gg_analytics.id%
                domain: 'auto'
                trackPageLoadTime: true
                anonymizeIp: false
                crossDomain: %app.gg_analytics.domains%
        
# CravlerMaxmindGeoIPBundle Configuration
cravler_max_mind_geo_ip:
#    path: '%kernel.root_dir%/Resources/MaxMind'
    path: '/usr/local/share/GeoIP'
    db:
        country: 'GeoIP2-Country.mmdb'
        city: 'GeoLite2-City.mmdb'
        connection_type: 'GeoIP2-Connection-Type.mmdb'
        domain: 'GeoIP2-Domain.mmdb'
        isp: 'GeoIP2-ISP.mmdb'
    source:
        country: ~
        city: ~
        connection_type: ~
        domain: ~
        isp: ~
        
#SncRedisBundle configuration
snc_redis:
    clients:
        default:
            type: predis
            alias: default
            dsn: redis://%database_host%
            logging: %kernel.debug%
    doctrine:
        metadata_cache:
            client: default
            namespace: "%kernel.root_dir%"
            entity_manager: [default]
        result_cache:
            client: default
            namespace: "%kernel.root_dir%"
            entity_manager: [default]
        query_cache:
            client: default
            namespace: "%kernel.root_dir%"
            entity_manager: [default]
        
# KachkaevAssetsVersionBundle Configuration
kachkaev_assets_version: ~

# SendinBlueBundle Configuration
sendin_blue_api:
    api_key: %sendinblue_api_key%
    timeout: 5000

# GoogleTagManagerBundle Configuration
google_tag_manager:
    enabled: true
    id: "GTM-%gtm_id%"
    autoAppend: false

# AlekittoCompressorBundle Configuration
kcs_compressor:
    enabled:              true      # Set to false to disable the compressor
    compress_html:        true      # Enable HTML optimizations
    preserve_line_breaks: false     # Enable the line breaks preservation
    remove_comments:      true      # Remove HTML comments while compressing
    remove_extra_spaces:  true      # Remove extra spaces in HTML
    compress_js:          false     # Enable inline js compression
    compress_css:         false     # Enable inline css compression

# eldoMainBundle Configuration
eldo_main:
