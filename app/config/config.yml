            default:
                id:         %default_strandlink_id%
                key:        %default_strandlink_key%
            tips:
                id:         %tips_strandlink_id%
                key:        %tips_strandlink_key%
            imc:
                id:         %imc_strandlink_id%
                key:        %imc_strandlink_key%
            ideal_weight:
                id:         %ideal_weight_strandlink_id%
                key:        %ideal_weight_strandlink_key%
            calories:
                id:         %calories_strandlink_id%
                key:        %calories_strandlink_key%
    onesignal:
        default_app:            %onesignal_default_app%
