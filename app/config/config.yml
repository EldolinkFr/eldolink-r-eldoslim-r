# MopaBootstrapBundle Configuration
mopa_bootstrap:
    form:
        checkbox_label: 'label'
        show_legend: false
        render_fieldset: false
        render_optional_text: false

# KnpSnappyBundle Configuration
knp_snappy:
    pdf:
        enabled:    true
        binary:     /usr/local/bin/wkhtmltopdf
        options:    []
    image:
        enabled:    true
        binary:     /usr/local/bin/wkhtmltoimage
        options:    []

# FOSUserBundle Configuration
fos_user:
    db_driver: orm
    firewall_name: main
    user_class: eldo\MainBundle\Entity\Customer
    service:
        user_manager: eldo_main.customer_manager
    from_email:
        address:        "%app.admin_email%"
        sender_name:    "%app.admin_email%"

# FOSRestBundle Configuration
fos_rest:
    param_fetcher_listener: true
    body_listener: true
    format_listener:
        rules:
            - { path: '^/api', priorities: [ json, xml ], fallback_format: ~, prefer_extension: true }
            - { path: '^/', stop: true }
            
    body_converter:
        enabled: false
        validate: false
    
    view:
        view_response_listener: 'force'
        formats:
            xml:  true
            json: true
        templating_formats:
            html: true

    exception:
        codes:
            'Symfony\Component\Routing\Exception\ResourceNotFoundException': 404
            'Doctrine\ORM\OptimisticLockException': HTTP_CONFLICT
        messages:
            'Symfony\Component\Routing\Exception\ResourceNotFoundException': true
    allowed_methods_listener: true
    access_denied_listener:
        json: true

    disable_csrf_role: ROLE_API

# NelmioApiDocBundle Configuration
nelmio_api_doc: ~

# JMSTranslationBundle Configuration
jms_translation:
    configs:
        app:
            dirs: ['%kernel.root_dir%', '%kernel.root_dir%/../src']
            output_dir: '%kernel.root_dir%/Resources/translations'
            ignored_domains: [routes]
            excluded_names: ["*TestCase.php", "*Test.php"]
            excluded_dirs: [cache, data, logs]

# JMSI18nRoutingBundle Configuration
jms_i18n_routing:
    default_locale: "%locale%"
    locales: "%app.locales%"
    strategy: prefix_except_default
    cookie:
        enabled: false
    
# DoctrineCacheBundle Configuration
doctrine_cache:
    providers:
        memcached_cache:
            namespace: memcached_ns
            type: memcached

# MobileDetectBundle Configuration
mobile_detect:
    redirect:
        mobile: ~
        tablet: ~
    switch_device_view: ~

# Stof\DoctrineExtensionBundle configuration
stof_doctrine_extensions:
    orm:
        default:
            sluggable: true
            loggable: true

# KnpGaufretteBundle configuration
knp_gaufrette:
    stream_wrapper: ~

    adapters:
        media_s3_adapter:
            aws_s3:
                service_id: 'eldo_main.media.s3'
                bucket_name: '%amazon_s3.medias_bucket_name%'
                detect_content_type: true
                options:
                    create: true
                    directory: 'media'
        document_s3_adapter:
            aws_s3:
                service_id: 'eldo_main.document.s3'
                bucket_name: "%amazon_s3.documents_bucket_name%"
                detect_content_type: true
                options:
                    create: true
                    directory: 'document'
                    
    filesystems:
        media_s3_fs:
            adapter:    media_s3_adapter
        document_s3_fs:
            adapter:    document_s3_adapter

# VichUploaderBundle configuration
vich_uploader:
    db_driver: orm
    storage:   gaufrette

    mappings:
        media:
            inject_on_load: true
#             uri_prefix: 'https://%amazon_s3.medias_bucket_name%.%amazon_s3.base_url%/%amazon_s3.medias_directory_name%'
            uri_prefix: ~
            namer:              vich_uploader.namer_uniqid
            directory_namer:    eldo_main.directory_namer
            upload_destination: media_s3_fs
            delete_on_update:   false
            delete_on_remove:   false 
        document:
            inject_on_load: true
            uri_prefix: "%amazon_s3.base_url%/%amazon_s3.documents_bucket_name%"
            namer:              vich_uploader.namer_uniqid
            directory_namer:    eldo_main.directory_namer
            upload_destination: document_s3_fs
            delete_on_update:   false
            delete_on_remove:   false 

# CravlerMaxmindGeoIPBundle Configuration
cravler_max_mind_geo_ip:
    path: '%kernel.project_dir%/var/MaxMind'
    client:
        user_id: '%maxmind_geoip_user_id%'
        license_key: '%maxmind_geoip_license_key%'
    db:
        country: 'GeoIP2-Country.mmdb'
#         city: 'GeoLite2-City.mmdb'
#         connection_type: 'GeoIP2-Connection-Type.mmdb'
#         domain: 'GeoIP2-Domain.mmdb'
        isp: 'GeoIP2-ISP.mmdb'
    source:
        country: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Country&suffix=tar.gz&license_key=%maxmind_geoip_license_key%'
#         city: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-City&suffix=tar.gz&license_key=%maxmind_geoip_license_key%'
#         connection_type: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Connection-Type&suffix=tar.gz&license_key=%maxmind_geoip_license_key%'
#         domain: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Domain&suffix=tar.gz&license_key=%maxmind_geoip_license_key%'
        isp: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-ISP&suffix=tar.gz&license_key=%maxmind_geoip_license_key%'
        
#SncRedisBundle configuration
snc_redis:
    clients:
        default:
            type: predis
            alias: default
            dsn: 'redis://%database_host%'
            logging: '%kernel.debug%'
    doctrine:
        metadata_cache:
            client: default
            entity_manager: default
            namespace: 'dmc:'
        result_cache:
            client: default
            entity_manager: default
            namespace: 'drc:'
        query_cache:
            client: default
            entity_manager: default
            namespace: 'dqc:'
        second_level_cache:
            client: default
            entity_manager: default
            namespace: 'dslc:'
        
# KachkaevAssetsVersionBundle Configuration
kachkaev_assets_version: ~

# GoogleTagManagerBundle Configuration
google_tag_manager:
    enabled: true
    id: "GTM-%gtm_id%"
    autoAppend: false

