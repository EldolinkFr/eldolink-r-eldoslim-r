        api_key:    %newrelic_api_key%
    mailjet:
        api_key:    %mailjet_api_key%
        api_secret: %mailjet_api_secret%
        list_id:    %mailjet_list_id%
    oxone:
        api_url:    %oxone_api_url%
        username:   %oxone_username%
        password:   %oxone_password%
    sendgrid:
        username:   %sendgrid_username%
        password:   %sendgrid_password%
    neverbounce:
        username:   %neverbounce_username%
        secret_key: %neverbounce_secret_key%
    leadiance:
        url:        %leadiance_url%
    messagebusiness:
        url:        %messagebusiness_url%
        account_id: %messagebusiness_account_id%
        api_key:    %messagebusiness_api_key%
    openweathermap:
        url:        %openweathermap_url%
        api_key:    %openweathermap_api_key%
    googlemap:
        api_key:    %googlemap_api_key%
    googleanalytics:
        config:    %googleanalytics_config%
    firebase:
        api_key:                %firebase_api_key%
        dynamic_link_url:       %firebase_dynamic_link_url%
        dynamic_link_domain:    %firebase_dynamic_link_domain%
    gtm:
        id:        %gtm_id%
    strandlink:
