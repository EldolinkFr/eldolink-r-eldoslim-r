imports:
    - { resource: config.yml }

framework:
    router:
        resource: "%kernel.root_dir%/config/routing_dev.yml"
        strict_requirements: true
    profiler: { only_exceptions: false }

web_profiler:
    toolbar: true
    intercept_redirects: true

doctrine:
    orm:
        metadata_cache_driver:
            type: service
            id: snc_redis.default
        result_cache_driver:
            type: service
            id: snc_redis.default
        query_cache_driver:
            type: service
            id: snc_redis.default
        second_level_cache:
            enabled:            true
            log_enabled:        true
            region_cache_driver:
                type: service
                id: snc_redis_cache_driver
            region_lock_lifetime: 60
            region_lifetime: 600
            regions:
                region_cached:
                    lifetime: 3600
                    cache_driver:
                        type: service
                        id: snc_redis_cache_driver

monolog:
    handlers:
        main:
            type:   stream
            path:   "%kernel.logs_dir%/%kernel.environment%.log"
            level:  debug
        console:
            type:   console
            bubble: false
            verbosity_levels:
                VERBOSITY_VERBOSE: INFO
                VERBOSITY_VERY_VERBOSE: DEBUG
            channels: ["!doctrine"]
        console_very_verbose:
            type:   console
            bubble: false
            verbosity_levels:
                VERBOSITY_VERBOSE: NOTICE
                VERBOSITY_VERY_VERBOSE: NOTICE
                VERBOSITY_DEBUG: DEBUG
            channels: ["doctrine"]
        # uncomment to get logging in your browser
        # you may have to allow bigger header sizes in your Web server configuration
        #firephp:
        #    type:   firephp
        #    level:  info
        #chromephp:
        #    type:   chromephp
        #    level:  info

assetic:
    use_controller: true

swiftmailer:
    delivery_address: %app.admin_email%