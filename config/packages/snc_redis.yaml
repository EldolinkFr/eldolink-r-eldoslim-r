snc_redis:
    clients:
        default:
            type: predis
            alias: default
            dsn: '%env(resolve:REDIS_URL)%'
            logging: '%kernel.debug%'
        session:
            type: predis
            alias: session
            dsn: '%env(resolve:REDIS_URL)%/1'
            logging: true
    session:
        client: default
    doctrine:
        metadata_cache:
            client: default
            entity_manager: default
            document_manager: default
        result_cache:
            client: default
            entity_manager: default
        query_cache:
            client: default
            entity_manager: default
        second_level_cache:
            client: default
            entity_manager: default
