snc_redis:
    clients:
        default:
            type: predis
            alias: default
            dsn: '%env(resolve:REDIS_URL)%'
            logging: '%kernel.debug%'
        session:
            type: predis
            alias: session
            dsn: '%env(resolve:REDIS_URL)%/1'
            logging: true
    session:
        client: default
