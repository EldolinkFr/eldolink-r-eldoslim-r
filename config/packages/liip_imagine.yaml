# See dos how to configure the bundle: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    resolvers:
        resolver_s3_medias:
            aws_s3:
                client_config:
                    credentials:
                        key: '%env(resolve:amazon_s3_key)%'
                        secret: '%env(resolve:amazon_s3_secret)%'
                    region: '%env(resolve:amazon_s3_region)%'
                    version: 'latest'
                bucket: '%env(resolve:amazon_s3_medias_bucket_name)%cache'
                proxies: ['%env(resolve:app_cache_url)%cache']
    loaders:
        default:
            filesystem:
                data_root: ["%kernel.root_dir%/../public", "%kernel.root_dir%/../vendor"]
        loader_s3_medias:
            stream:
                wrapper: gaufrette://media_s3_fs/
    cache: resolver_s3_medias
    data_loader: loader_s3_medias
    filter_sets:
        original:
            post_processors:
                jpegoptim: { strip_all: true, max: 70, progressive: true }
                optipng: { strip_all: true, level: 5 }
# Local Loader
        local_ico:
            data_loader: default
            filters:
                thumbnail: { size: [16, 16], mode: outbound, allow_upscale: true }
            post_processors:
                jpegoptim: { strip_all: true, max: 70, progressive: true }
                optipng: { strip_all: true, level: 5 }
        local_apple_touch_icon:
            data_loader: default
            filters:
                thumbnail: { size: [129, 129], mode: outbound, allow_upscale: true }
