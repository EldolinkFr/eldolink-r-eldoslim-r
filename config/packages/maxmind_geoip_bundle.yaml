cravler_max_mind_geo_ip:
    path: '%kernel.project_dir%/var/MaxMind'
    client:
        user_id: '%env(resolve:maxmind_geoip_user_id)%'
        license_key: '%env(resolve:maxmind_geoip_license_key)%'
    db:
        country: 'GeoIP2-Country.mmdb'
#         city: 'GeoLite2-City.mmdb'
#         connection_type: 'GeoIP2-Connection-Type.mmdb'
#         domain: 'GeoIP2-Domain.mmdb'
        isp: 'GeoIP2-ISP.mmdb'
    source:
        country: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Country&suffix=tar.gz&license_key=%env(resolve:maxmind_geoip_license_key)%'
#         city: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-City&suffix=tar.gz&license_key=%env(resolve:maxmind_geoip_license_key)%'
#         connection_type: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Connection-Type&suffix=tar.gz&license_key=%env(resolve:maxmind_geoip_license_key)%'
#         domain: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-Domain&suffix=tar.gz&license_key=%env(resolve:maxmind_geoip_license_key)%'
        isp: 'https://download.maxmind.com/app/geoip_download?edition_id=GeoIP2-ISP&suffix=tar.gz&license_key=%env(resolve:maxmind_geoip_license_key)%'
